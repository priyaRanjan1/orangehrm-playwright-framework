name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Create Failsafe Environment File for CI
      run: |
        echo 'BASE_URL="https://opensource-demo.orangehrmlive.com/"' > .env.qa
        echo 'ORANGEHRM_USERNAME="Admin"' >> .env.qa
        echo 'ORANGEHRM_PASSWORD="admin123"' >> .env.qa

    - name: Run Playwright tests
      env:
        ENV: qa
      run: npx playwright test

    - name: Upload Playwright Native HTML Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Allure Observability Results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30
